# contracts/A1/mrgr_model_architecture_contract.yaml
# =============================================================================
# AUTHORITATIVE PHASE 24+ MODEL A1 ARCHITECTURE & PROTOCOL CONTRACT (v3.0.0)
# =============================================================================
# Target Models:
#   - SCPW-only: Season-Conditioned Predictor Weighting + Adapted RISE-UNet
#   - MRGR-only: Monotonic Reliability-Gated Recursive Refinement + Adapted RISE-UNet
#   - Combined : Season-Aware MRGR-RISE-UNet (SCPW + MRGR)
#   - Ablations: Constant-calendar [0,0] SCPW control; SCPW + ungated residual (r*=r+delta)
#
# Governance Posture:
#   - Aligned 1-to-1 with Updated Thesis Proposal ("Improving DL-DM RISE-UNet:
#     Seasonal Conditioning and Reliability-Gated Recursive Refinement for
#     Probabilistic Subseasonal Root-Zone Soil-Moisture Forecasting", Oct 12 2026 Outline).
#   - Must be evaluated strictly alongside:
#       contracts/A0/thesis_revised_baseline_and_data_contract.yaml (v3.0.0)
#   - Supersedes v2.0.0 (2026-10-11 MRGR-only + frozen A0 + clipped r* + DOY concat).

contract_name: SCPW_MRGR_MODEL_ARCHITECTURE_CONTRACT
version: "3.0.0-scpw-mrgr-thesis-revised"
status: "SPECIFICATION_LOCKED_IMPLEMENTATION_PENDING"
last_updated: "2026-11-19"

revision_history:
  v1.0.0: "2026-09-17 — Initial Phase 24 single shared R_theta(., k) residual concept."
  v2.0.0: "2026-10-11 — Pair-specific MRGR + MO-DOY/monsoon concatenation into x_h + 100% frozen Model A0 backbone + clipped [0,1] r* + M=11."
  v3.0.0: "2026-11-19 — Harmonized to Updated Thesis PDF: adds SCPW module inside stage backbone, UNFREEZES active consumer backbone + SCPW + CorrectionNets jointly, removes [0,1] clipping on r*, introduces ModelRzsmReluExtraConv (10.24M/stage), 80/10/10 purged split, 9-year nested OOF cross-fitted risk banks, D=10 MC dropout (M=110), B=66, and matched ablations."

# -----------------------------------------------------------------------------
# 1. STAGE BACKBONE & OPTIMIZATION OWNERSHIP (UNFROZEN CONSUMER RULE)
# -----------------------------------------------------------------------------
stage_backbone_policy:
  backbone_implementation: "parent_study_ex29/function/modelRzsmReluExtraConv.py"
  filter_schedule: [32, 64, 128, 256]
  lead_stages: ["W1", "W2", "W3", "W4"]
  sequential_stage_ownership:
    frozen_during_consumer_h:
      - "All preceding full-training weekly stages W1..W(h-1) and their BN moving statistics (fixed inference mode)"
      - "All incoming RiskNet_{j->h} branches (after initial Huber training)"
      - "All training-fitted preprocessing transforms T_in, T_out, climatology, thresholds"
    jointly_trained_during_consumer_h:
      - "Active consumer RISE-UNet backbone F_h (NOT frozen!)"
      - "Active consumer SCPW branch (when enabled)"
      - "All incoming CorrectionNet_{j->h} branches (when MRGR enabled)"
  shared_initialization_and_w1_reuse:
    - "Matching backbone layers across Baseline, SCPW-only, MRGR-only, Combined receive identical initial weights per seed [42, 123, 456]."
    - "W1 checkpoint from Baseline is reused identically by MRGR-only (W1 has no MRGR handoff)."
    - "W1 checkpoint from SCPW-only is reused identically by Combined (SCPW + MRGR)."
  parameter_counts_per_lead_stage:
    backbone_extraconv: {W1: 10240723, W2: 10243539, W3: 10223827, W4: 10226643}
    scpw_branch: {W1: 15024, W2: 15024, W3: 5808, W4: 5808}
    mrgr_pairs_entering_stage: {W1: 0, W2: 5250, W3: 8196, W4: 12294}
    total_overhead_all_leads_combined: 67404   # ~0.16% of 4-stage ~40.93M backbone total

# -----------------------------------------------------------------------------
# 2. SEASON-CONDITIONED PREDICTOR WEIGHTING (SCPW) SPECIFICATION (SEC 2.4.1-2.4.2)
# -----------------------------------------------------------------------------
scpw_module:
  purpose: "Add explicit calendar-modulated residual features inside each weekly backbone without modifying input channel counts or RiskNet/CorrectionNet inputs."
  insertion_location: "Strictly after initial full-resolution 128-channel inception representation u_h = conv1_1_inception(X_h) and BEFORE the following 64-channel conv_batchnorm_relu_block_SE_and_residual_connections composite (which feeds pool1 and level-1 nested skips)."
  nonrecursive_input_slice:
    W1_W2_channels: 11    # [3 antecedent RZSM, 5 ERA5 atmos, 3 ECMWF S2S]
    W3_W4_channels: 3     # [3 antecedent RZSM only]
  calendar_descriptor:
    midpoint_date_formula: "d_h(t) = t + 7*(h - 1) + 3 days"
    vector_definition: "s_h(t) = [sin(2*pi*(n - 1)/Y), cos(2*pi*(n - 1)/Y)]"
    constant_control_ablation: "s_h(t) = [0.0, 0.0] during both training and inference (retains Conv3x3_128 + MLP)."
  branch_architecture:
    feature_conv: "Conv2D(filters=128, kernel_size=3, padding='same', activation='relu', use_bias=True)"
    mlp:
      input_dim: 2
      hidden_layer: "Dense(16, activation='relu')"
      output_layer: "Dense(128, activation='linear', kernel_initializer='zeros', bias_initializer='zeros')"
    gating_formula: "w_h = 1.0 + 0.25 * tanh(MLP_h(s_h(t)))  in [0.75, 1.25]^(128)"
    residual_injection: "u_h^S = u_h + (w_h - 1.0) * z_h  (initially 0 at step 0 due to zero-init MLP output)"
    parameter_count:
      W1_W2_11ch: 15024   # Conv3x3(11->128)=12800 + MLP(2->16->128)=2224
      W3_W4_3ch: 5808     # Conv3x3(3->128)=3584 + MLP(2->16->128)=2224

# -----------------------------------------------------------------------------
# 3. MONOTONIC RELIABILITY-GATED RECURSIVE REFINEMENT (MRGR) (SEC 2.4.4-2.4.5)
# -----------------------------------------------------------------------------
mrgr_module:
  directed_handoffs_count: 6
  directed_handoff_pairs:
    - "M_1_to_2: source W1 -> consumer W2 (x_2: 11 ch, r_1: 1 ch)"
    - "M_1_to_3: source W1 -> consumer W3 (x_3: 3 ch, r_1: 1 ch)"
    - "M_2_to_3: source W2 -> consumer W3 (x_3: 3 ch, r_2: 1 ch)"
    - "M_1_to_4: source W1 -> consumer W4 (x_4: 3 ch, r_1: 1 ch)"
    - "M_2_to_4: source W2 -> consumer W4 (x_4: 3 ch, r_2: 1 ch)"
    - "M_3_to_4: source W3 -> consumer W4 (x_4: 3 ch, r_3: 1 ch)"
  source_independence_invariant: "Each directed handoff starts from the original stored source prediction r_j in physical units (m^3/m^3). Downstream W1->W3 uses original r_1, NOT W1->W2 refined r*_{1->2}."

  branch_topology_per_handoff:
    notes: "Independent weights per directed handoff for both RiskNet and CorrectionNet. NO BatchNormalization and NO Dropout inside RiskNet or CorrectionNet. Unmodulated raw normalized x_h only."
    shared_encoder_stem:
      conv_x: "Conv2D(8, kernel_size=3, padding='same', activation='relu')(x_h)"
      conv_r: "Conv2D(8, kernel_size=3, padding='same', activation='relu')(r_j)"
      concat_24ch: "Concat([e_x, e_r, abs(e_x - e_r)], axis=-1)"
      fusion_conv: "Conv2D(8, kernel_size=3, padding='same', activation='relu')(concat_24ch)"
    risknet_head: "Conv2D(1, kernel_size=1, padding='same', activation='softplus') -> q_hat >= 0"
    correctionnet_head: "Conv2D(1, kernel_size=1, padding='same', activation='linear', kernel_initializer='zeros', bias_initializer='zeros') -> d_theta"
    parameter_count_per_branch:
      x_11ch_W2: 2625     # 3*3*11*8+8=800 + 3*3*1*8+8=80 + 3*3*24*8+8=1736 + 9 = 2625
      x_3ch_W3_W4: 2049   # 3*3*3*8+8=224 + 80 + 1736 + 9 = 2049

  mathematical_equations:
    physical_scale_constant: "c_{j->h} = max(P_95(|r_{j,OOF} - y_j|), 1e-6 m^3/m^3) over active cells & training-bank entries"
    risk_target_eq3: "q_{j->h} = |r_{j,OOF} - y_j| / (c_{j->h} + 1e-6)"
    risk_loss: "Active-cell mean Huber loss (delta=1.0 in normalized error units), equal issue/member/draw weighting, Adam 1e-4, max 40 epochs"
    reliability_gate_eq5: "G_{j->h} = exp(-q_hat_{j->h}) in (0, 1]"
    bounded_delta_eq6: "delta_{j->h} = c_{j->h} * tanh(d_{theta, j->h})"
    gated_state_eq7: "r_{j->h}^* = r_j + (1.0 - G_{j->h}) * delta_{j->h}  (NO clipping; out-of-[0,1] counts logged!)"
    ungated_ablation: "r_{j->h}^* = r_j + delta_{j->h} (retains SCPW, removes (1 - G))"
    consumer_transform_eq9: "X_h = Concat(x_h, {T_{h<-j}(r_{j->h}^*)}_{j<h}) using fixed consumer input scale."

# -----------------------------------------------------------------------------
# 4. CROSS-FITTED RECURSIVE RESIDUAL BANK & TRAJECTORY PROTOCOL (SEC 2.3.1, 2.4.7)
# -----------------------------------------------------------------------------
oof_cross_fitting_and_trajectories:
  strategy: "Blocked, interval-purged out-of-fold (OOF) forecasts across the 9 training calendar years (2015..2023) inside the 851-case training split."
  separate_banks_required: ["MRGR-only (each consumer h=2,3,4)", "Combined SCPW+MRGR (each consumer h=2,3,4)"]
  nesting_and_caching: "At h>2, preceding pathway W1..W(h-1) uses inner nested OOF cross-fitting on remaining fold years without leaking held-out year. Unordered excluded-year subset deduplication cuts redundant OOF prefix fits from 675 to 183 per seed per MRGR config."
  stochastic_trajectories:
    mc_dropout_draws_D: 10
    physical_ecmwf_members: 11
    total_draws_per_case: 110
    training_trajectory_cache: "Generate 10 fixed stochastic upstream prefix trajectories per member; each training epoch samples 1 trajectory per issue retaining its 11-member group."
    validation_trajectory_cache: "Independent fixed stream of 10 trajectories per member for reproducible checkpoint selection."

# -----------------------------------------------------------------------------
# 5. MATCHED MODEL CONFIGURATIONS & ABLATION SUITE (TABLE 6 & TABLE 7)
# -----------------------------------------------------------------------------
configuration_suite:
  - "External: Persistence baseline (carry t-1 weekly RZSM across W1-W4)"
  - "Primary 1 (Baseline): Adapted RISE-UNet (modelRzsmReluExtraConv, SCPW=off, MRGR=off)"
  - "Primary 2 (Single-module): RISE-UNet with MRGR (SCPW=off, MRGR=on; reuses Baseline W1)"
  - "Primary 3 (Single-module): RISE-UNet with SCPW (SCPW=on, MRGR=off)"
  - "Primary 4 (Combined): Season-Aware MRGR-RISE-UNet (SCPW=on, MRGR=on; reuses SCPW W1)"
  - "Ablation 1 (Constant-calendar control): SCPW topology with s_h=[0,0] always"
  - "Ablation 2 (Ungated correction): SCPW + r*=r+delta without (1-G) reliability gate"
  - "External Benchmarks: Separately trained U-Net regression [24] and UNet++ regression [25]"

diagnostic_and_sensitivity_requirements:
  risk_validity: "Group q_hat into fixed val-derived deciles/bins per handoff; report realized |r_j-y_j| per bin, Spearman rank rho, mean |r*-y_j|-|r-y_j|, and out-of-[0,1] frequency."
  controlled_sensitivity_test: "Replace one source r_j at a time with r(m) = y_j + m*(r_j - y_j) for m in {0, 0.5, 1, 1.5, 2} directly before MRGR/handoff; report CRPS & MAE vs m and slope over m>=1."
  interaction_contrast: "Compute paired CRPS interaction = (Combined - MRGR-only) - (SCPW-only - Baseline)."
