channel_topology:
  ensemble_members: 11
  lead_channels:
    lead_1: 11  # 3 RZSM lags + 5 ERA5 surface + 3 ECMWF S2S W1
    lead_2: 12  # 3 RZSM lags + 5 ERA5 surface + 3 ECMWF S2S W2 + 1 recursive y_hat_W1
    lead_3: 5   # 3 RZSM lags + 2 recursive (y_hat_W1, y_hat_W2)
    lead_4: 6   # 3 RZSM lags + 3 recursive (y_hat_W1, y_hat_W2, y_hat_W3)
  target_shape_per_case: [1, 32, 48, 1]
  target_shape_loss_broadcast: [11, 32, 48, 1]

normalization_contract:
  contract_artifact: "contracts/A0/normalization_parameters.yaml"
  scope: "training_cases_only_eval_cells_only_domain_wide_active_scalar"
  rzsm_bounds:
    seasonal_anomaly_min: -0.17837415635585785
    seasonal_anomaly_max: 0.17734764516353607
    scaling_formula: "(x - min) / (max - min)"
    target_scale: "[0.0, 1.0]"
  ocean_fill: 0.0

architecture_and_optimization:
  model_class: "UNET_RZSM"
  total_parameters_lead_1: 1627139
  total_parameters_lead_2: 1630307
  output_heads: ["RZSM_output_1", "RZSM_output_2", "RZSM_output_3"]
  deep_supervision_loss_weights: [0.2, 0.3, 0.5]
  loss_function: "spatial_crps_loss"
  loss_formula: "MAE_eval - 0.08 * spatial_spread"
  optimizer:
    name: "Adam"
    learning_rate: 0.0001
    beta_1: 0.9
    beta_2: 0.999
    epsilon: 1.0e-7
  batch_size_evaluation_schedule:
    provisional_pilot_sizes: [11, 22, 33, 44, 66]
    parent_ex29_reference: 66  # 6 cases x 11 members
    hardware_target: "NVIDIA Tesla T4 (15,360 MB VRAM)"
    vram_headroom_t4_gb: 4.79  # at B=66, peak VRAM is 10.57 GB
  training_schedule:
    max_epochs: 40
    early_stopping_patience: 8
    primary_checkpoint_metric: "val_crps"
    checkpoint_mode: "min"
    seeds: [42, 123, 456]
  reporting_metrics:
    - "ACC (Anomaly Correlation Coefficient)"
    - "MAE (Mean Absolute Error)"
    - "RMSE (Root Mean Square Error)"
    - "CRPS (Continuous Ranked Probability Score)"
    - "Brier Score (Moderate Drought < -1.0 sigma)"
    - "Brier Score (Severe Drought < -1.5 sigma)"
    - "Brier Score (Extreme Drought < -2.0 sigma)"
