parent_ex29_contextual_reference_comparison:
  title: "Parent EX29 Contextual Reference Comparison — CONTEXTUAL / REPORTED REFERENCE"
  status: "CONTEXTUAL / REPORTED REFERENCE"
  certification_classification: "CONTEXTUAL_REPORTED_REFERENCE"
  taxonomy_distinction: "[VERIFIED] is strictly retained for programmatic/architectural parity with parent EX29 source code. Empirical metric comparison against CONUS literature numbers is classified as a contextual reference comparison, preventing conflation of cross-regime empirical results with source code verification."
