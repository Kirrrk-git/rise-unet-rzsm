taxonomy_scope:
  pass_definition: "Software, mathematical, and numerical assertions pass with zero failures and zero errors."
  verified_definition: "Direct mathematical and programmatic parity established with the parent EX29 implementation/source code."
  accepted_definition: "Deliberate, scientifically documented regional adaptation for Mindanao (grid, atmospheric variables, reforecast pipeline, ERA5-Land RZSM target)."


