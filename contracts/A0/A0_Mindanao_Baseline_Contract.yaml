  total_usable_cases: 1073
  total_provider_mars_exceptions: 74
  total_boundary_oob_exceptions: 7
  scheduled_train_val_cohort: 945
  effective_usable_train_val: 871
  conservation_identity: "945 scheduled == 871 usable (677 Train + 194 Val) + 74 ECMWF provider MARS exceptions (Delta = 0)"
