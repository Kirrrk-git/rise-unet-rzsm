  contextual_benchmark_comparison:
    W1: {mindanao_acc: 0.8544, parent_reported_acc: 0.82, mindanao_rmse: 0.0505, parent_reported_rmse: 0.050}
    W2: {mindanao_acc: 0.6824, parent_reported_acc: 0.65, mindanao_rmse: 0.0714, parent_reported_rmse: 0.070}
    W3: {mindanao_acc: 0.5629, parent_reported_acc: 0.55, mindanao_rmse: 0.0800, parent_reported_rmse: 0.080}
