    scheduled_count: 209
    usable_evaluation_denominator: 202
    target_out_of_bounds_count: 7
    quarantine_status: "STRICTLY_SEALED_UNTIL_PHASE_26"

channel_schedule:
  ensemble_members_per_case: 11
  lead_channels:
    lead_1: 11  # 3 antecedent RZSM lags + 5 ERA5 surface + 3 ECMWF S2S W1
    lead_2: 12  # 3 antecedent RZSM lags + 5 ERA5 surface + 3 ECMWF S2S W2 + 1 recursive y_hat_W1
    lead_3: 5   # 3 antecedent RZSM lags + 2 recursive (y_hat_W1, y_hat_W2)
    lead_4: 6   # 3 antecedent RZSM lags + 3 recursive (y_hat_W1, y_hat_W2, y_hat_W3)

architecture_and_training:
  backbone: "UNET_RZSM"
  deep_supervision_heads: ["RZSM_output_1", "RZSM_output_2", "RZSM_output_3"]
  deep_supervision_loss_weights: [0.2, 0.3, 0.5]
  parameter_counts:
    W1: 1627139
    W2: 1630307
    W3: 1608131
    W4: 1611299
  batch_size:
    nominal_pre_production_freeze: 11  # 1 case x 11 members (initial minimum configuration)
    production_execution_amendment: 33  # 3 cases x 11 members
    amendment_date: "2026-09-17"
    amendment_commit: "62500f8 (engine implementation) / e2b35d9 (training execution & evaluation)"
    amendment_rationale: "Improved production throughput and provided a larger three-case mini-batch for more stable batch statistics while remaining within the certified T4 memory envelope (peak 5.6 GB VRAM vs. 15.4 GB capacity)."

    effect_on_scientific_interpretation: "Documented as an authoritative production-training hyperparameter. Ingesting 3 cases (33 members) provides sample diversity for BatchNorm statistics across 3 distinct meteorological events per gradient step while strictly preserving 11-member ensemble realization ordering and loss broadcasting invariance."

  optimizer: "Adam (lr=1e-4, beta1=0.9, beta2=0.999, eps=1e-7)"
  lr_schedule: "ReduceLROnPlateau (factor=0.5, patience=3, min_lr=1e-6)"
  early_stopping: "patience=8, restore_best_weights=True"
  loss_objective: "spatial_crps_loss (MAE_eval - 0.08 * sigma_spatial)"
  training_hardware: "NVIDIA Tesla T4 (15,360 MB VRAM) on Google Colab"
  tensorflow_version: "2.20.0"

